<div class="add-period-card">
  <div class="add-period-header">+ Adicionar período
     <span class="btn-close" (click)="close()">✕</span>

  </div>
  
  <div class="add-period-body">

    <!-- ANO -->
    <div class="field-group">
      <label class="field-label">
        {{ type === 'BIANUAL' ? 'ANO INICIAL' : 'ANO' }}
      </label>

      <input
        type="number"
        class="field-input"
        [(ngModel)]="year"
        (ngModelChange)="verifyYear($event)"
      />
    </div>

    <div class="field-group" *ngIf="type === 'BIANUAL' && year">
      <label class="field-label">ANO FINAL</label>

      <input
        type="number"
        class="field-input"
        [value]="year + 1"

      />
    </div>

    <div class="field-group">
      <label class="field-label">TIPO</label>

      <div class="custom-select-wrapper">

        <div
          class="custom-select-trigger"
          [class.trigger-anual]="type === 'ANUAL'"
          [class.trigger-bianual]="type === 'BIANUAL'"
          (click)="$event.stopPropagation(); typeDropdownOpen = !typeDropdownOpen"
        >
          <span class="select-icon">{{ getTypeIcon(type) }}</span>
          <span class="select-label">{{ getTypeLabel(type) }}</span>
          <span class="select-freq">{{ getTypeFreq(type) }}</span>
          <span class="select-arrow">▾</span>
        </div>

        <div
          class="custom-select-dropdown"
          *ngIf="typeDropdownOpen"
          (click)="$event.stopPropagation()"
        >
          <div
            class="custom-select-option"
            *ngFor="let opt of typeOptions"
            [class.selected]="type === opt.value"
            [class.option-anual]="opt.value === 'ANUAL' && type === opt.value"
            [class.option-bianual]="opt.value === 'BIANUAL' && type === opt.value"
            (click)="selectType(opt.value)"
          >
            <span class="opt-icon">{{ opt.icon }}</span>

            <span class="opt-info">
              <span class="opt-label">{{ opt.label }}</span>
              <span class="opt-freq">{{ opt.freq }}</span>
            </span>

            <span class="opt-check" *ngIf="type === opt.value">✓</span>
          </div>
        </div>

      </div>
    </div>

    <div class="preview-period" *ngIf="year">
      Período:
      <strong>
        {{ type === 'BIANUAL' ? (year + '–' + (year + 1)) : year }}
      </strong>
    </div>

    <button class="btn-add" (click)="addPeriod()" [disabled]="yearInvalido">
      Adicionar
      {{ type === 'BIANUAL' ? (year + '–' + (year + 1)) : year }}
    </button>

  </div>
</div>
